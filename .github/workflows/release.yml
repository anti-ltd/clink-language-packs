name: Publish language packs
on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable release version (for example 2026.08.22)
        required: true
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'Lexicons/**'
      - 'catalog/**'
      - 'source/**'
      - 'tools/**'
      - 'build-pack.py'
      - '.github/workflows/release.yml'
# Never interrupt an upload or let two runs publish over one another.
concurrency:
  group: language-pack-release
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve immutable release version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            V="$REQUESTED_VERSION"
          elif [[ "$GITHUB_REF_TYPE" == tag ]]; then
            V="$GITHUB_REF_NAME"
          else
            # Stable on retries; unique even for two pushes on the same day.
            V="v$(git show -s --format=%cd --date=format-local:%Y.%m.%d "$GITHUB_SHA").${GITHUB_RUN_ID}"
          fi
          [[ "$V" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || {
            echo "Invalid release version" >&2
            exit 1
          }
          echo "RELEASE_VERSION=$V" >> "$GITHUB_ENV"
      - name: Build manifest and release assets
        run: |
          set -euo pipefail
          V="$RELEASE_VERSION"; mkdir out
          python3 tools/validate-catalog.py
          for lexicon in Lexicons/*.clex; do
            code="${lexicon##*/}"
            [[ "$code" == ._* ]] && continue
            python3 tools/validate-pack.py "${code%.clex}"
          done
          python3 tools/build-release-manifest.py "$V" "${{ github.repository }}" out
      - name: Stage release assets without changing production latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="$RELEASE_VERSION"
          # A public release becomes GitHub's "latest" immediately.  Keeping it
          # draft until every file is present prevents production clients from
          # ever observing a missing or partial manifest.
          if gh release view "$V" --json isDraft --jq .isDraft >/dev/null 2>&1; then
            test "$(gh release view "$V" --json isDraft --jq .isDraft)" = true || {
              echo "Refusing to mutate an already-published release: $V" >&2
              exit 1
            }
          else
            gh release create "$V" --target "$GITHUB_SHA" --draft --generate-notes --title "$V"
          fi

          # GitHub throttles large batches of individual Core ML files.  Retry
          # each idempotent upload with backoff; a rerun resumes the same draft.
          upload() {
            local file="$1" attempt=1
            until gh release upload "$V" "$file" --clobber; do
              if (( attempt == 8 )); then
                echo "Upload failed after $attempt attempts: $file" >&2
                return 1
              fi
              local delay=$((attempt * 15))
              echo "Retrying $file in ${delay}s (attempt $((attempt + 1))/8)" >&2
              sleep "$delay"
              ((attempt += 1))
            done
          }

          while IFS= read -r -d '' file; do
            upload "$file"
            sleep 2
          done < <(find out/assets -type f -print0 | sort -z)
          upload out/manifest.json

      - name: Publish the complete staged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="$RELEASE_VERSION"
          test "$(gh release view "$V" --json isDraft --jq .isDraft)" = true
          gh release edit "$V" --draft=false
