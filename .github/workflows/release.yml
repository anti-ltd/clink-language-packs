name: Publish language packs
on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable release version (for example 2026.08.22)
        required: true
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build manifest and release assets
        run: |
          set -euo pipefail
          V="${{ inputs.version || github.ref_name }}"; mkdir out
          python3 tools/validate-catalog.py
          python3 tools/build-release-manifest.py "$V" "${{ github.repository }}" out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          generate_release_notes: true
          files: out/**
