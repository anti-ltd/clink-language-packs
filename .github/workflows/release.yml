name: Publish language packs
on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable release version (for example 2026.08.22)
        required: true
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build manifest and release assets
        run: |
          set -euo pipefail
          V="${{ inputs.version || github.ref_name }}"; mkdir out
          python3 tools/validate-catalog.py
          python3 tools/build-release-manifest.py "$V" "${{ github.repository }}" out
      - name: Publish release assets at a safe API rate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="${{ inputs.version || github.ref_name }}"
          # A Core ML pack expands to several files.  This release has hundreds
          # of assets, so bulk upload actions can hit GitHub's secondary REST
          # limit.  Create-or-resume and pace each idempotent upload instead.
          gh release view "$V" >/dev/null 2>&1 || gh release create "$V" --generate-notes --title "$V"
          while IFS= read -r -d '' file; do
            gh release upload "$V" "$file" --clobber
            sleep 1
          done < <(find out -type f -print0 | sort -z)
